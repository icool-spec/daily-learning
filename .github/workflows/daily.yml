name: Daily Green Commit

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily record
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> daily.txt

      - name: Commit and push
        run: |
          git config user.name "icool-spec"
          git config user.email "1349163789@qq.com"

          git add daily.txt
          git commit -m "daily: $(date -u '+%Y-%m-%d')" || exit 0
          git push
